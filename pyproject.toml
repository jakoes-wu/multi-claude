[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-claude"
dynamic = ["version"]
description = "Run several Claude Code accounts side by side: separate CLAUDE_CONFIG_DIR directories, launchers, proxies, environment variables and arguments."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
multi-claude = "multi_claude.cli:main"

[project.urls]
Homepage = "https://github.com/jakoes-wu/multi-claude"

[tool.setuptools.dynamic]
version = {attr = "multi_claude.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
