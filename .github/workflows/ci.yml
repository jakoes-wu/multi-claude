name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          # The macOS arm64 runners may not provide Python 3.8, so macOS starts at 3.10.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows runners, so the grep checks below run unchanged on every OS.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tools
        run: python -m pip install pyflakes
      - name: Lint
        run: python -m pyflakes src tests
      - name: README links
        # README.md is also the PyPI project page, where relative links 404: allow only full URLs and in-page anchors.
        run: |
          if grep -noE '\]\([^)]+\)' README.md | grep -vE '\]\((https?://|#)'; then
            echo 'README.md has relative links; use https://github.com/jakoes-wu/multi-claude/blob/main/... instead'; exit 1
          fi
      - name: Tests must not hard-code home directories
        # helpers.py builds every path from a temporary directory; nothing else may name a real home.
        run: "! grep -rnE '/Users/|/home/' tests --include='*.py' --exclude=helpers.py"
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck lsof
      - name: Test
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -t tests -v
      - name: Test (Windows)
        # The other suites drive the POSIX sh launchers, symlinks and permission bits;
        # test_windows covers the Windows code paths (launch, junctions, locks, migration, completion);
        # test_launchgate covers the pre-launch network check, including the launch entry and named pipes.
        if: runner.os == 'Windows'
        run: python -m unittest -v test_windows test_launchgate
        working-directory: tests
