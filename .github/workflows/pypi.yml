name: Publish to PyPI

# 发布 release 时构建 sdist 与 wheel，经 PyPI Trusted Publishing 上传（docs/feature/feature-distribution.md §5.1.1）。
# 不用 API token：PyPI 只给本仓库这个工作流、环境 pypi 临时签发凭据，前提是维护者已在 PyPI 上
# 把它登记为 trusted publisher。没登记时 build 照常通过，publish 失败，不影响 release 本身。
# workflow_dispatch 用来给已经发布的 tag 补传（例如首次配置 PyPI 之前发布的版本）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 只经环境变量引用 tag，不在 run 里内联 ${{ }}，避免脚本注入。
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
          ls -l dist
      - name: Check the version
        # wheel 文件名里的版本必须等于 tag 去掉 v，防止忘了改 __version__ 就发布。
        run: |
          version="${TAG#v}"
          test -f "dist/multi_claude_cli-${version}-py3-none-any.whl" || { echo "no wheel for ${version} in dist/"; exit 1; }
          test -f "dist/multi_claude_cli-${version}.tar.gz" || { echo "no sdist for ${version} in dist/"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
